version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nest_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_db
    ports:
      - '5433:5432' # <--- აქ შევცვალეთ 5433-ზე
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: