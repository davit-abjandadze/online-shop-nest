services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_db
    ports:
      - '5434:5432' # 5433 არის დამოკავშირებული ორიგინალ (referendum) პროექტის nest_postgres კონტეინერზე — განზრახ სხვა პორტი, რომ ორივე პარალელურად, ერთმანეთის მონაცემების გარეშე დგებოდეს.
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
